<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>温馨小木屋 · 我的动画作品</title>
  <meta name="description" content="温馨小木屋 —— 收录 AI 制作的动画短片作品，欢迎来看。" />
  <meta name="theme-color" content="#15120f" />
  <meta name="author" content="hi3612" />

  <!-- 分享到社交平台时的预览信息 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="温馨小木屋 · 我的动画作品" />
  <meta property="og:description" content="把喜欢的故事，一间一间收好" />
  <meta property="og:url" content="https://hi3612.github.io" />

  <link rel="stylesheet" href="css/style.css?v=12" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 L29 14 L26 14 L26 28 L19 28 L19 21 L13 21 L13 28 L6 28 L6 14 L3 14 Z' fill='%23e0a869'/%3E%3C/svg%3E" />

  <!-- 在页面渲染前就把主题定好，避免闪白 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('wxm_theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- ============ 顶部导航 ============ -->
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="index.html">
        <svg class="nav-logo-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 3 L29 14 L26 14 L26 28 L19 28 L19 21 L13 21 L13 28 L6 28 L6 14 L3 14 Z"
                fill="url(#roofGrad)" />
          <rect x="14" y="16" width="4" height="4" rx="0.8" fill="#1a1408" opacity="0.7" />
          <defs>
            <linearGradient id="roofGrad" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0%" stop-color="#f2c08a" />
              <stop offset="100%" stop-color="#c4773a" />
            </linearGradient>
          </defs>
        </svg>
        <span class="nav-logo-text" id="navSiteName">温馨小木屋</span>
      </a>

      <div class="nav-spacer"></div>

      <div class="nav-actions">
        <a class="icon-btn" id="githubLink" href="https://github.com" target="_blank" rel="noopener"
           title="去我的 GitHub 主页" aria-label="GitHub 主页">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>

        <button class="icon-btn" id="themeToggle" title="切换浅色 / 深色" aria-label="切换主题">
          <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
          </svg>
          <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ============ 主体 ============ -->
  <main class="page">

    <!-- 顶部欢迎区 -->
    <header class="hero">
      <h1 class="hero-title" id="heroTitle">温馨小木屋</h1>
      <p class="hero-tagline" id="heroTagline">把喜欢的故事，一间一间收好</p>

      <div class="hero-stats" id="heroStats">
        <div class="hero-stat">
          <span class="hero-stat-num" id="statWorks">0</span>
          <span class="hero-stat-label">部作品</span>
        </div>
        <div class="hero-stat-divider"></div>
        <div class="hero-stat">
          <span class="hero-stat-num" id="statEps">0</span>
          <span class="hero-stat-label">集内容</span>
        </div>
        <div class="hero-stat-divider"></div>
        <div class="hero-stat">
          <span class="hero-stat-num" id="statTime">0</span>
          <span class="hero-stat-label">分钟</span>
        </div>
      </div>
    </header>

    <!-- 继续观看（没有观看记录时自动隐藏） -->
    <section id="continueSection" style="display: none;">
      <div class="section-head">
        <h2 class="section-title">继续观看</h2>
        <div class="section-line"></div>
      </div>
      <a class="continue-card" id="continueCard" href="#">
        <div class="continue-thumb">
          <img id="continueThumb" src="" alt="" />
        </div>
        <div class="continue-info">
          <div class="continue-title" id="continueTitle"></div>
          <div class="continue-meta" id="continueMeta"></div>
          <div class="continue-bar">
            <div class="continue-bar-fill" id="continueBarFill"></div>
          </div>
        </div>
        <div class="continue-go">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5.5v13l11-6.5z" />
          </svg>
          <span>接着看</span>
        </div>
      </a>
    </section>

    <!-- 作品列表 -->
    <section>
      <div class="section-head">
        <h2 class="section-title">全部作品</h2>
        <div class="section-line"></div>
      </div>

      <div class="works-grid" id="worksGrid"></div>

      <div class="empty-state" id="emptyState" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 L12 3 L21 10.5 V20 a1 1 0 0 1 -1 1 H4 a1 1 0 0 1 -1 -1 Z" />
          <path d="M9 21 V14 h6 v7" />
        </svg>
        <p>小木屋还空着，作品正在路上～</p>
      </div>
    </section>

  </main>

  <!-- ============ 页脚 ============ -->
  <footer class="site-footer">
    <span>© <span id="footerYear">2026</span> 温馨小木屋</span>
    <div class="footer-spacer"></div>
    <a class="footer-link" id="footerGithub" href="https://github.com" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span>GitHub</span>
    </a>
  </footer>

  <!-- 返回顶部 -->
  <button class="to-top" id="toTop" title="回到顶部" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5M5 12l7-7 7 7" />
    </svg>
  </button>

  <script src="js/data.js?v=12"></script>
  <script src="js/common.js?v=12"></script>
  <script src="js/home.js?v=12"></script>
</body>
</html>
